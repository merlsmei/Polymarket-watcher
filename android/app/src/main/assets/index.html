<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Polymarket Macro Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --gold: #f0c040;
      --silver: #a0aabc;
      --bronze: #cd7f32;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    .logo span { color: var(--text); }
    .badge {
      background: var(--accent);
      color: #0d1117;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .header-right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
    #status { display: flex; align-items: center; gap: 6px; }
    #status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.live { background: var(--green); animation: pulse 2s infinite; }
    #status-dot.loading { background: var(--yellow); }
    #status-dot.error { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .refresh-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: border-color .2s;
    }
    .refresh-btn:hover { border-color: var(--accent); }
    .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Filter bar ── */
    .filter-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-right: 4px; }
    .tag-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: all .15s;
    }
    .tag-btn.active {
      background: rgba(88,166,255,.15);
      border-color: var(--accent);
      color: var(--accent);
    }
    .tag-btn:hover:not(.active) { border-color: var(--muted); color: var(--text); }
    .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    .min-bet-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      width: 80px;
    }

    /* ── Time window tabs ── */
    .tabs-wrapper {
      padding: 16px 20px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 4px;
    }
    .tab {
      padding: 8px 18px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid transparent;
      border-bottom: none;
      transition: all .15s;
      user-select: none;
    }
    .tab.active {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
      margin-bottom: -1px;
    }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── Main content ── */
    main { padding: 20px; }

    .window-panel { display: none; }
    .window-panel.active { display: block; }

    .panel-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 16px;
    }
    .panel-title { font-size: 16px; font-weight: 700; }
    .panel-subtitle { font-size: 12px; color: var(--muted); }

    .tables-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .tables-row { grid-template-columns: 1fr; }
    }

    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-card-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .table-card-title { font-size: 13px; font-weight: 600; }
    .table-card-icon { font-size: 16px; }

    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 8px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th.right, td.right { text-align: right; }
    td {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    /* Rank badges */
    .rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px; height: 22px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .rank-1 { background: rgba(240,192,64,.2); color: var(--gold); }
    .rank-2 { background: rgba(160,170,188,.15); color: var(--silver); }
    .rank-3 { background: rgba(205,127,50,.15); color: var(--bronze); }
    .rank-n { background: var(--surface2); color: var(--muted); }

    .market-name {
      display: block;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      word-break: break-word;
    }
    .market-name:hover { color: var(--accent); }
    .dir-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 3px;
      margin-top: 4px;
      letter-spacing: .3px;
    }
    .dir-yes { background: rgba(63,185,80,.18); color: var(--green); }
    .dir-no  { background: rgba(248,81,73,.14); color: var(--red); }
    .dir-mid { background: rgba(210,153,34,.14); color: var(--yellow); }
    .outcome-badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      margin-top: 3px;
      background: var(--surface2);
      color: var(--muted);
    }

    .vol { font-weight: 700; color: var(--text); }
    .vol-sub { font-size: 11px; color: var(--muted); }
    .price {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
    }
    .price-yes { background: rgba(63,185,80,.15); color: var(--green); }
    .price-no  { background: rgba(248,81,73,.12); color: var(--red); }
    .price-mid { background: rgba(210,153,34,.12); color: var(--yellow); }

    .no-data {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── Loading / Splash overlay ── */
    #loading {
      position: fixed;
      inset: 0;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      gap: 0;
    }
    #loading.hidden { display: none; }
    .splash-logo {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .splash-logo span { color: var(--text); }
    .splash-tagline {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(88,166,255,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-msg {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      max-width: 280px;
      min-height: 18px;
    }

    /* ── Summary bar ── */
    .summary-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .summary-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; }
    .summary-value { font-size: 20px; font-weight: 700; color: var(--accent); }
    .summary-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .error-banner {
      background: rgba(248,81,73,.1);
      border: 1px solid rgba(248,81,73,.3);
      color: var(--red);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .countdown { font-size: 11px; color: var(--muted); }
    .bg-refreshing {
      font-size: 11px; color: var(--accent);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .bg-refreshing .spin-sm {
      display: inline-block; width: 10px; height: 10px;
      border: 1.5px solid rgba(88,166,255,.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ── Panel loading progress bar ── */
    .panel-loading-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      background: rgba(88,166,255,.05);
      border-bottom: 1px solid rgba(88,166,255,.12);
      font-size: 12px;
      color: var(--text-dim);
    }
    .panel-loading-text { flex-shrink: 0; }
    .progress-track {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width .3s ease;
    }

    /* ── Portrait / narrow layout ── */
    .portrait-values {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      font-size: 12px;
    }
    @media (orientation: portrait), (max-width: 600px) {
      .tables-row { grid-template-columns: 1fr; }
      .landscape-col { display: none !important; }
      .portrait-values { display: flex; }
    }
  </style>
</head>
<body>

<!-- Splash / Loading overlay -->
<div id="loading">
  <div class="splash-logo">Poly<span>Tracker</span></div>
  <div class="splash-tagline">Macro Prediction Markets</div>
  <div class="spinner"></div>
  <div id="loading-msg">Fetching macro markets…</div>
</div>

<!-- Header -->
<header>
  <div class="header-left">
    <div class="logo">Poly<span>Tracker</span></div>
    <div class="badge">Macro</div>
  </div>
  <div class="header-right">
    <div id="status">
      <div id="status-dot"></div>
      <span id="status-text">Connecting…</span>
    </div>
    <span class="countdown" id="next-refresh"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="triggerRefresh()">↻ Refresh</button>
  </div>
</header>

<!-- Filter bar -->
<div class="filter-bar">
  <span class="filter-label">Category</span>
  <button class="tag-btn active" data-tag="all" onclick="setTag(this,'all')">All Macro</button>
  <button class="tag-btn" data-tag="2" onclick="setTag(this,'2')">🏛 Politics</button>
  <button class="tag-btn" data-tag="120" onclick="setTag(this,'120')">💹 Finance</button>
  <button class="tag-btn" data-tag="100265" onclick="setTag(this,'100265')">🌍 Geopolitics</button>
  <div class="divider"></div>
  <span class="filter-label">Min bet</span>
  <input class="min-bet-input" type="number" id="min-bet" value="1000" min="0" step="100" onchange="applyFilters()" />
  <span class="filter-label">USDC</span>
  <div class="divider"></div>
  <label class="filter-label">Hide tails &lt;</label>
  <input class="min-bet-input" type="number" id="filter-extreme-pct" value="3" min="0" max="49" step="1" style="width:50px" onchange="applyFilters()" />
  <span class="filter-label">% (&gt;100−X%)</span>
</div>

<!-- Time window tabs -->
<div class="tabs-wrapper">
  <div class="tab active" data-window="1H" onclick="setWindow(this)">1H</div>
  <div class="tab" data-window="4H"  onclick="setWindow(this)">4H</div>
  <div class="tab" data-window="8H"  onclick="setWindow(this)">8H</div>
  <div class="tab" data-window="24H" onclick="setWindow(this)">24H</div>
  <div class="tab" data-window="1W"  onclick="setWindow(this)">1W</div>
</div>

<!-- Main content -->
<main>
  <div id="error-banner" class="error-banner" style="display:none"></div>

  <!-- One panel per time window -->
  <div id="panel-1H"  class="window-panel active"></div>
  <div id="panel-4H"  class="window-panel"></div>
  <div id="panel-8H"  class="window-panel"></div>
  <div id="panel-24H" class="window-panel"></div>
  <div id="panel-1W"  class="window-panel"></div>
</main>

<script>
// ─────────────────────────────────────────────
//  Config
// ─────────────────────────────────────────────
const GAMMA_BASE = 'https://gamma-api.polymarket.com';
const DATA_BASE  = 'https://data-api.polymarket.com';

const WINDOWS = [
  { id: '1H',  seconds: 3_600,   label: 'Last 1 Hour' },
  { id: '4H',  seconds: 14_400,  label: 'Last 4 Hours' },
  { id: '8H',  seconds: 28_800,  label: 'Last 8 Hours' },
  { id: '24H', seconds: 86_400,  label: 'Last 24 Hours' },
  { id: '1W',  seconds: 604_800, label: 'Last 7 Days' },
];

const MACRO_TAGS = [
  { id: '2',      name: 'Politics' },
  { id: '120',    name: 'Finance' },
  { id: '100265', name: 'Geopolitics' },
];

const REFRESH_INTERVAL_S = 60;  // 1 min auto-refresh
const TRADE_PAGES_MAX = 20;     // max pages per market-batch (batches are small — macro markets only)
const BATCH_SIZE = 50;          // conditionIds per /trades?market= request
const SLEEP_MS = 150;           // between paginated requests

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let macroMarketsAll = {};  // conditionId → { title, slug, tagId, prices } — always all categories
let allTrades     = [];    // trades sorted ASC by timestamp (oldest → newest), past 1 week
let rankings      = {};    // windowId → { byTotalEL[], byMaxEL[] }
let currentWindow = '1H';
let activeTag     = 'all';
let fetching      = false;
let lastFetchTs   = null;
let refreshTimer  = null;
let countdownInterval = null;
let isFirstLoad   = true;
let newestTradeTs = 0;    // Unix-seconds of the newest trade in allTrades (for incremental fetch)
let fetchedMinBet = null; // minBet used for the last full fetch (detect threshold changes)
let loadingProgress = null; // { done: N, total: N } while initial batches loading, else null

// ─────────────────────────────────────────────
//  Utilities
// ─────────────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));

function fmtUSDC(n) {
  if (n >= 1_000_000) return '$' + (n / 1_000_000).toFixed(2) + 'M';
  if (n >= 1_000)     return '$' + (n / 1_000).toFixed(1)     + 'K';
  return '$' + n.toFixed(0);
}

function fmtPrice(p) {
  const pct = Math.round(parseFloat(p) * 100);
  if (isNaN(pct)) return '?';
  return pct + '%';
}

function fmtTimestamp(ts) {
  if (!ts) return '';
  const diffMs   = Date.now() - ts * 1000;
  const diffMins = Math.floor(diffMs / 60_000);
  if (diffMins < 1)  return 'just now';
  if (diffMins < 60) return diffMins + 'm ago';
  const diffHrs = Math.floor(diffMins / 60);
  if (diffHrs < 24)  return diffHrs + 'h ago';
  return Math.floor(diffHrs / 24) + 'd ago';
}

function priceClass(p) {
  const v = parseFloat(p);
  if (isNaN(v)) return '';
  if (v >= 0.6) return 'price-yes';
  if (v <= 0.4) return 'price-no';
  return 'price-mid';
}

function setStatus(state, msg) {
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  dot.className = state;   // 'live' | 'loading' | 'error' | ''
  text.textContent = msg;
}

function setLoading(visible, msg = '') {
  const el = document.getElementById('loading');
  if (visible) {
    document.getElementById('loading-msg').textContent = msg;
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = '⚠ ' + msg;
  el.style.display = msg ? 'block' : 'none';
}

// ─────────────────────────────────────────────
//  API: Fetch macro markets from Gamma
// ─────────────────────────────────────────────
async function fetchMacroMarkets() {
  const markets = {};
  const tagsToFetch = MACRO_TAGS; // always fetch all categories; tag filtering happens at render time

  for (const tag of tagsToFetch) {
    let offset = 0;
    while (true) {
      const url = `${GAMMA_BASE}/events?tag_id=${tag.id}&closed=false&limit=100&offset=${offset}&order=volume24hr&ascending=false`;
      let resp;
      try { resp = await fetch(url); } catch (e) { break; }
      if (!resp.ok) break;
      const events = await resp.json();
      if (!Array.isArray(events) || events.length === 0) break;

      for (const ev of events) {
        // Skip events with no slug (can't build a valid link)
        if (!ev.slug) continue;
        // Skip resolved/closed events
        if (ev.closed === true || ev.archived === true) continue;
        if (ev.endDate && new Date(ev.endDate) < new Date()) continue;

        const mkts = Array.isArray(ev.markets) ? ev.markets : [];
        for (const m of mkts) {
          const cid = m.conditionId || m.condition_id;
          if (!cid) continue;
          // Skip inactive, closed, or resolved markets
          if (m.active === false || m.closed === true || m.archived === true) continue;
          if (m.endDate && new Date(m.endDate) < new Date()) continue;

          let prices = [];
          try { prices = m.outcomePrices ? JSON.parse(m.outcomePrices) : []; } catch {}
          // Skip markets already resolved (≥99% certainty on any outcome)
          if (prices.length > 0) {
            const maxP = Math.max(...prices.map(p => parseFloat(p)).filter(p => !isNaN(p)));
            if (maxP >= 0.99) continue;
          }

          let outcomes = [];
          try { outcomes = m.outcomes ? JSON.parse(m.outcomes) : []; } catch {}
          markets[cid] = {
            title:    m.question || ev.title || 'Unknown',
            slug:     ev.slug,   // always use event slug — market slugs can 404
            tagId:    tag.id,
            tagName:  tag.name,
            prices,
            outcomes,
            volume:   parseFloat(m.volume || 0),
          };
        }
      }

      if (events.length < 100) break;
      offset += 100;
      await sleep(SLEEP_MS);
    }
  }
  return markets;
}

// ─────────────────────────────────────────────
//  API: Fetch trades — batched by conditionId
//  Uses market= param to restrict to macro markets only,
//  so each batch covers a tiny fraction of Polymarket's global volume.
// ─────────────────────────────────────────────
async function fetchTradesBatched(sinceTs, minBet, conditionIds, onProgress, onBatchDone) {
  const collected = [];
  const totalBatches = Math.ceil(conditionIds.length / BATCH_SIZE);

  // Split conditionIds into batches of BATCH_SIZE
  for (let b = 0; b < conditionIds.length; b += BATCH_SIZE) {
    const batchIds = conditionIds.slice(b, b + BATCH_SIZE);
    const marketParam = batchIds.join(',');
    let offset = 0;
    let pages  = 0;
    let done   = false;

    while (!done && pages < TRADE_PAGES_MAX) {
      const params = new URLSearchParams({
        market:       marketParam,
        filterType:   'CASH',
        filterAmount: String(minBet),
        limit:        '500',
        offset:       String(offset),
        takerOnly:    'true',
      });
      let resp;
      try { resp = await fetch(`${DATA_BASE}/trades?${params}`); } catch (e) { break; }
      if (!resp.ok) break;

      const page = await resp.json();
      if (!Array.isArray(page) || page.length === 0) break;

      let added = 0;
      for (const t of page) {
        if ((+t.timestamp || 0) >= sinceTs) { collected.push(t); added++; }
      }
      // Stop this batch when an entire page is older than sinceTs
      if (added === 0 || page.length < 500) done = true;
      offset += page.length;
      pages++;
      onProgress && onProgress(`Fetching trades… ${collected.length.toLocaleString()} loaded`);
      if (!done) await sleep(SLEEP_MS);
    }

    // After each market-batch: sort and notify caller so UI can render incrementally
    if (onBatchDone) {
      collected.sort((a, b) => (+a.timestamp || 0) - (+b.timestamp || 0));
      onBatchDone(Math.floor(b / BATCH_SIZE) + 1, totalBatches, collected);
    }
  }

  // Final sort (already sorted if onBatchDone was used; sort once otherwise)
  if (!onBatchDone) collected.sort((a, b) => (+a.timestamp || 0) - (+b.timestamp || 0));
  return collected;
}

// ─────────────────────────────────────────────
//  Build rankings for a single time window
// ─────────────────────────────────────────────

// Returns macroMarketsAll filtered to the selected tag (or the full map for 'all').
// Called at ranking time so tag switching is instant — no re-fetch needed.
function getFilteredMarkets(tag) {
  if (tag === 'all') return macroMarketsAll;
  const out = {};
  for (const [cid, m] of Object.entries(macroMarketsAll)) {
    if (m.tagId === String(tag)) out[cid] = m;
  }
  return out;
}

// Binary search: first index in ASC-sorted trades[] where timestamp >= cutoff
function binarySearchCutoff(trades, cutoff) {
  let lo = 0, hi = trades.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if ((+trades[mid].timestamp || 0) < cutoff) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

function buildWindowRankings(trades, macroMarkets, windowSeconds, minBet, filterThreshold) {
  const cutoff = Math.floor(Date.now() / 1000) - windowSeconds;
  const byMarket = {};

  // trades is sorted ASC — binary-search to the window start instead of scanning all
  const startIdx = binarySearchCutoff(trades, cutoff);
  for (let i = startIdx; i < trades.length; i++) {
    const t = trades[i];
    const cid = t.conditionId;
    if (!cid || !macroMarkets[cid]) continue;

    const meta = macroMarkets[cid];

    // Price-based filters — use the highest current outcome price
    const pArr = (meta.prices || []).map(p => parseFloat(p)).filter(p => !isNaN(p));
    if (pArr.length > 0) {
      const maxP = Math.max(...pArr);
      // Always filter: market essentially resolved (≥99% certainty)
      if (maxP >= 0.99) continue;
      // User-defined tail filter: hide markets outside [X%, 100-X%]
      if (filterThreshold > 0 && maxP >= (1 - filterThreshold)) continue;
    }

    const price = parseFloat(t.price);
    if (isNaN(price) || price <= 0 || price >= 1) continue;
    const usdcValue    = parseFloat(t.size) * price;
    if (usdcValue < minBet) continue;
    // expectedLoss = amount at risk × probability of losing
    // = (size × price) × (1 − price)
    const expectedLoss = usdcValue * (1 - price);

    if (!byMarket[cid]) {
      byMarket[cid] = {
        conditionId:       cid,
        title:             meta.title,
        slug:              meta.slug,  // always event-level slug — reliable link
        tagName:           meta.tagName,
        prices:            meta.prices,
        outcomes:          meta.outcomes,
        totalVolume:       0,
        totalExpectedLoss: 0,
        maxExpectedLoss:   0,
        maxBet:            0,   // USDC value of the highest-EL trade (for badge display)
        tradeCount:        0,
        biggestTrade:      null, // trade with highest expectedLoss
      };
    }
    const entry = byMarket[cid];
    entry.totalVolume       += usdcValue;
    entry.totalExpectedLoss += expectedLoss;
    entry.tradeCount++;
    if (expectedLoss > entry.maxExpectedLoss) {
      entry.maxExpectedLoss = expectedLoss;
      entry.maxBet          = usdcValue;
      entry.biggestTrade    = t;
    }
  }

  const list = Object.values(byMarket);
  return {
    byTotalEL: [...list].sort((a, b) => b.totalExpectedLoss - a.totalExpectedLoss).slice(0, 30),
    byMaxEL:   [...list].sort((a, b) => b.maxExpectedLoss   - a.maxExpectedLoss  ).slice(0, 30),
  };
}

// ─────────────────────────────────────────────
//  Build all rankings
// ─────────────────────────────────────────────
function buildAllRankings(minBet) {
  const filterPct = Math.max(0, Math.min(49, parseFloat(document.getElementById('filter-extreme-pct').value) || 0));
  const filterThreshold = filterPct / 100;
  const markets = getFilteredMarkets(activeTag); // tag filter applied here — no re-fetch needed
  const result = {};
  for (const w of WINDOWS) {
    result[w.id] = buildWindowRankings(allTrades, markets, w.seconds, minBet, filterThreshold);
  }
  return result;
}

// ─────────────────────────────────────────────
//  Render
// ─────────────────────────────────────────────
function renderRankBadge(i) {
  const cls = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-n';
  return `<span class="rank ${cls}">${i + 1}</span>`;
}

function renderMarketName(entry) {
  const href = entry.slug
    ? `https://polymarket.com/event/${entry.slug}`
    : 'https://polymarket.com';
  return `<a class="market-name" href="${href}" target="_blank" rel="noopener" title="${entry.title}">${entry.title}</a>`;
}

function renderBetDirection(entry) {
  const t = entry.biggestTrade;
  if (!t) return '';
  const outcome = (t.outcome || '').trim();
  const price   = parseFloat(t.price);
  const low     = outcome.toLowerCase();
  const arrow   = low === 'yes' ? '▲' : low === 'no' ? '▼' : '●';
  const cls     = low === 'yes' ? 'dir-yes' : low === 'no' ? 'dir-no' : 'dir-mid';
  const ago = fmtTimestamp(t.timestamp);
  return `<span class="dir-badge ${cls}">${arrow} ${outcome} ${fmtPrice(price)} · ${fmtUSDC(entry.maxBet)} bet · ${fmtUSDC(entry.maxExpectedLoss)} EL${ago ? ' · ' + ago : ''}</span>`;
}

function renderTable(rows, mode) {
  if (!rows || rows.length === 0) {
    return `<table><tbody><tr><td class="no-data" colspan="9">No trades in this window</td></tr></tbody></table>`;
  }

  const isTotalEL = mode === 'volume';
  let html = `<table>
    <thead><tr>
      <th>#</th>
      <th>Market</th>
      <th class="right landscape-col">${isTotalEL ? 'Total EL' : 'Max EL'}</th>
      <th class="right landscape-col">Trades</th>
    </tr></thead>
    <tbody>`;

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const mainValue = isTotalEL ? r.totalExpectedLoss : r.maxExpectedLoss;
    const subValue  = isTotalEL
      ? `${fmtUSDC(r.totalVolume)} vol · ${r.tradeCount} trade${r.tradeCount !== 1 ? 's' : ''}`
      : `${fmtUSDC(r.maxBet)} bet`;
    html += `<tr>
      <td>${renderRankBadge(i)}</td>
      <td>
        ${renderMarketName(r)}
        ${renderBetDirection(r)}
        <div class="portrait-values">
          <span class="vol">${fmtUSDC(mainValue)} EL</span>
          <span class="vol-sub">${subValue}</span>
        </div>
        <small class="outcome-badge">${r.tagName || ''}</small>
      </td>
      <td class="right landscape-col"><span class="vol">${fmtUSDC(mainValue)}</span><br><span class="vol-sub">${subValue}</span></td>
      <td class="right landscape-col">${r.tradeCount.toLocaleString()}</td>
    </tr>`;
  }

  html += '</tbody></table>';
  return html;
}

function renderSummary(windowId) {
  const r = rankings[windowId];
  if (!r) return '';
  const totalEL     = r.byTotalEL.reduce((s, x) => s + x.totalExpectedLoss, 0);
  const totalTrades = r.byTotalEL.reduce((s, x) => s + x.tradeCount, 0);
  const maxSingleEL = r.byMaxEL[0] ? r.byMaxEL[0].maxExpectedLoss : 0;
  return `
    <div class="summary-bar">
      <div class="summary-item">
        <div class="summary-value">${fmtUSDC(totalEL)}</div>
        <div class="summary-label">Total expected loss</div>
      </div>
      <div class="summary-item">
        <div class="summary-value">${totalTrades.toLocaleString()}</div>
        <div class="summary-label">Qualifying trades</div>
      </div>
      <div class="summary-item">
        <div class="summary-value">${fmtUSDC(maxSingleEL)}</div>
        <div class="summary-label">Max single trade EL</div>
      </div>
      <div class="summary-item">
        <div class="summary-value">${r.byTotalEL.length}</div>
        <div class="summary-label">Active markets</div>
      </div>
    </div>`;
}

function renderAllPanels() {
  const progressHtml = loadingProgress
    ? `<div class="panel-loading-bar">
        <span class="panel-loading-text">Loading market data… ${loadingProgress.done} of ${loadingProgress.total} groups</span>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.round(loadingProgress.done / loadingProgress.total * 100)}%"></div></div>
      </div>`
    : '';
  for (const w of WINDOWS) {
    const r = rankings[w.id] || { byTotalEL: [], byMaxEL: [] };
    document.getElementById(`panel-${w.id}`).innerHTML = `
      <div class="panel-header">
        <span class="panel-title">${w.label}</span>
        <span class="panel-subtitle">ranked by expected loss · EL = bet × p(lose)</span>
      </div>
      ${progressHtml}
      ${renderSummary(w.id)}
      <div class="tables-row">
        <div class="table-card">
          <div class="table-card-header">
            <span class="table-card-icon">🐋</span>
            <span class="table-card-title">Ranked by Highest Single Expected Loss</span>
          </div>
          ${renderTable(r.byMaxEL, 'largest')}
        </div>
        <div class="table-card">
          <div class="table-card-header">
            <span class="table-card-icon">📊</span>
            <span class="table-card-title">Ranked by Total Expected Loss</span>
          </div>
          ${renderTable(r.byTotalEL, 'volume')}
        </div>
      </div>`;
  }
}

// ─────────────────────────────────────────────
//  Main refresh flow
// ─────────────────────────────────────────────
function setBgProgress(msg) {
  // Replaces countdown text with an animated spinner + message
  document.getElementById('next-refresh').innerHTML =
    `<span class="bg-refreshing"><span class="spin-sm"></span>${msg}</span>`;
}

async function refresh(force = false) {
  if (fetching) return;
  fetching = true;
  clearCountdown();
  document.getElementById('refresh-btn').disabled = true;
  setStatus('loading', 'Refreshing…');
  showError('');

  const minBet      = parseFloat(document.getElementById('min-bet').value) || 0;
  const oneWeekAgo  = Math.floor(Date.now() / 1000) - 604_800;
  const firstLoad   = isFirstLoad;
  const isFullFetch = firstLoad || newestTradeTs === 0;
  const sinceTs     = isFullFetch ? oneWeekAgo : newestTradeTs;

  const onProgress = firstLoad
    ? msg => setLoading(true, msg)
    : msg => setBgProgress(msg);

  try {
    onProgress('Fetching macro markets…');
    macroMarketsAll = await fetchMacroMarkets();

    const conditionIds = Object.keys(macroMarketsAll);
    if (conditionIds.length === 0) throw new Error('No macro markets found. Polymarket API may be temporarily unavailable.');

    const label = isFullFetch ? '1 week' : 'last refresh';
    onProgress(`Found ${conditionIds.length} markets. Fetching trades since ${label}…`);

    // Progressive batch callback: dismiss splash after first batch, show in-panel progress bar.
    // Only used for full fetches (first load or forced re-fetch after filter change).
    let splashDismissed = false;
    const onBatchDone = isFullFetch ? (done, total, sortedTrades) => {
      allTrades = sortedTrades; // sortedTrades is the live collected[] reference — already sorted ASC
      loadingProgress = { done, total };
      if (firstLoad && !splashDismissed) {
        setLoading(false);  // dismiss splash — show app immediately
        splashDismissed = true;
      }
      rankings = buildAllRankings(minBet);
      renderAllPanels();
    } : null;

    const newTrades = await fetchTradesBatched(sinceTs, minBet, conditionIds, onProgress, onBatchDone);

    if (isFullFetch) {
      allTrades = newTrades; // newTrades === sortedTrades from last callback (same reference)
    } else {
      // Incremental: merge new trades, deduplicate, prune old
      const seen = new Set(allTrades.map(t => t.transactionHash));
      const fresh = newTrades.filter(t => !seen.has(t.transactionHash));
      allTrades = [...allTrades, ...fresh];
      let pruneIdx = 0;
      while (pruneIdx < allTrades.length && (+allTrades[pruneIdx].timestamp || 0) < oneWeekAgo) pruneIdx++;
      if (pruneIdx > 0) allTrades = allTrades.slice(pruneIdx);
    }

    // Track newest trade timestamp for next incremental fetch
    if (allTrades.length > 0) {
      newestTradeTs = +allTrades[allTrades.length - 1].timestamp || 0;
    }
    fetchedMinBet = minBet;

    loadingProgress = null; // all batches done — hide progress bar
    rankings = buildAllRankings(minBet);
    renderAllPanels();

    lastFetchTs = new Date();
    setStatus('live', `Updated ${lastFetchTs.toLocaleTimeString()}`);
  } catch (err) {
    setStatus('error', 'Error');
    showError(err.message || 'Failed to fetch data. Check your network connection.');
    console.error(err);
  } finally {
    if (firstLoad) setLoading(false); // safety: dismiss splash even if error before first batch
    loadingProgress = null;           // safety: clear bar on error
    isFirstLoad = false;
    fetching    = false;
    document.getElementById('refresh-btn').disabled = false;
    startCountdown();
  }
}

// ─────────────────────────────────────────────
//  Countdown to next refresh
// ─────────────────────────────────────────────
function startCountdown() {
  let remaining = REFRESH_INTERVAL_S;
  clearCountdown();
  updateCountdown(remaining);
  countdownInterval = setInterval(() => {
    remaining--;
    updateCountdown(remaining);
    if (remaining <= 0) {
      clearCountdown();
      refresh();
    }
  }, 1000);
}

function clearCountdown() {
  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  document.getElementById('next-refresh').textContent = '';
}

function updateCountdown(s) {
  document.getElementById('next-refresh').textContent = `Next refresh in ${s}s`;
}

// ─────────────────────────────────────────────
//  UI interactions
// ─────────────────────────────────────────────
function setWindow(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.window-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  currentWindow = el.dataset.window;
  document.getElementById(`panel-${currentWindow}`).classList.add('active');
}

function setTag(el, tagId) {
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  activeTag = tagId;
  applyFilters(); // instant re-rank — no re-fetch; all category trades already in allTrades
}

function applyFilters() {
  const minBet = parseFloat(document.getElementById('min-bet').value) || 0;
  if (fetchedMinBet !== null && minBet !== fetchedMinBet) {
    // Threshold changed — must re-fetch since the API filter changes too
    newestTradeTs = 0;
    allTrades = [];
    triggerRefresh();
    return;
  }
  rankings = buildAllRankings(minBet);
  renderAllPanels();
}

function triggerRefresh() {
  clearCountdown();
  refresh(true);
}

// ─────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────
refresh();
</script>
</body>
</html>
